<style>
:root{--tx:#1b2a33;--card:#fff;--soft:#f3f6f9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--tx:#e8eef2;--card:#1d2a32;--soft:#26353e;color-scheme:dark}}
:root[data-theme="dark"]{--tx:#e8eef2;--card:#1d2a32;--soft:#26353e;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#6a11cb 0%,#2575fc 55%,#00c9a7 100%) fixed;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);display:flex;justify-content:center;align-items:flex-start}
.stage{width:100%;max-width:980px;padding:14px}
header{display:flex;align-items:center;gap:12px;color:#fff;margin-bottom:12px}
header h1{margin:0;font-size:22px;text-shadow:0 2px 6px #0005}header p{margin:0;opacity:.9}
.lg{height:64px;border-radius:12px;background:#fff;padding:3px}
.grid{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.stage{min-height:min(560px,56.25vw)}}
.c{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 8px 22px #0004}
.h{width:100%;display:flex;align-items:center;gap:10px;padding:16px 14px;border:0;background:var(--c);color:#fff;font-size:18px;font-weight:700;cursor:pointer;text-align:left}
.ic{font-size:26px}.h b{flex:1}.h i{font-style:normal;transition:transform .3s}
.c.open .h i{transform:rotate(180deg)}
.dd{max-height:0;overflow:hidden;transition:max-height .35s ease}
.c.open .dd{max-height:300px}
.l{display:block;width:100%;margin:0;padding:13px 16px;border:0;border-bottom:1px solid var(--soft);background:var(--card);color:var(--tx);text-align:left;font-size:16px;text-decoration:none;cursor:pointer}
.l small{display:block;opacity:.65}
.l:hover,.l:focus-visible{background:var(--soft);outline:0}
.sel{margin-top:14px;padding:12px 14px;border-radius:14px;background:#ffffffee;color:#1b2a33;text-align:center;direction:rtl;font-weight:600}
footer{margin-top:14px;text-align:center;color:#fff;font-weight:700;text-shadow:0 1px 4px #0005}
footer a{color:#fff}
