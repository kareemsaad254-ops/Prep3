<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prep 3 Revision – Interactive Book</title>
<style>
:root{--bg:#f6f8fa;--card:#fff;--tx:#1b2a33;--mu:#5d6b75;--pr:#1f5260;--ok:#2e9e5b;--okb:#dff4e7;--no:#d64545;--nob:#fbe3e3;--bd:#d5dde3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181d;--card:#19252c;--tx:#e8eef2;--mu:#9fb0ba;--pr:#5fb3c7;--okb:#16372501;--okb:#173a28;--nob:#44201f;--bd:#2c3b44;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px;color:var(--pr)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font-size:15px;font-weight:600}
.tabs button.on{background:var(--pr);color:var(--bg);border-color:var(--pr)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mu);font-size:14px}
.q{font-size:19px;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:13px 14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font-size:17px}
.opt.ok{background:var(--okb);border-color:var(--ok)}
.opt.no{background:var(--nob);border-color:var(--no);animation:sh .35s}
.msg{min-height:28px;font-weight:700;margin:6px 0;direction:rtl;text-align:center}
.row{display:flex;gap:8px}.row button,.big{flex:1;padding:12px;border-radius:12px;border:0;font-size:16px;font-weight:600;background:var(--pr);color:var(--bg)}
.row .sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.txt{line-height:2.4}
.blank{display:inline-block;min-width:104px;min-height:36px;border-bottom:3px dashed var(--mu);text-align:center;vertical-align:middle;padding:0 8px;border-radius:6px;font-weight:700}
.blank.ok{border-bottom:3px solid var(--ok);background:var(--okb);color:var(--ok)}
.blank.no{animation:sh .35s;background:var(--nob)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;padding:12px;border:1px dashed var(--bd);border-radius:12px;min-height:56px}
.chip{padding:8px 14px;background:var(--pr);color:var(--bg);border-radius:20px;font-weight:600;touch-action:none;user-select:none;-webkit-user-select:none}
.chip.sel{outline:3px solid var(--ok)}.chip.gone{display:none}
.chip.fly{position:fixed;z-index:50;pointer-events:none;opacity:.9}
.hint{color:var(--mu);font-size:14px;direction:rtl;text-align:center}
.exp{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0;direction:rtl;line-height:1.8;display:none}
.score{font-size:42px;text-align:center;margin:10px 0}
.cf{position:fixed;top:45%;left:50%;font-size:26px;pointer-events:none;z-index:60;animation:fl 1.1s ease-out forwards}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes fl{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.tabs{display:none}
body{background:linear-gradient(160deg,#6a11cb 0%,#2575fc 55%,#00c9a7 100%) fixed;min-height:100vh}
h1{color:#fff;text-align:center;text-shadow:0 2px 6px #0004}
.card{box-shadow:0 8px 24px #0004;border:0}
.opt{font-weight:600}
.opt:nth-of-type(1){border-color:#ff7eb3}.opt:nth-of-type(2){border-color:#ffb347}.opt:nth-of-type(3){border-color:#4facfe}.opt:nth-of-type(4){border-color:#43e97b}
.opt.ok{border-color:var(--ok)}.opt.no{border-color:var(--no)}
.bar i{background:linear-gradient(90deg,#ff7eb3,#ffb347,#43e97b)}
.row button,.big{background:linear-gradient(90deg,#6a11cb,#2575fc);color:#fff}
.nb{display:inline-block;min-width:34px;height:34px;line-height:34px;text-align:center;border-radius:50%;background:linear-gradient(135deg,#ff7eb3,#ff6a3d);color:#fff;font-size:16px;margin-right:4px}
.sig{max-width:640px;margin:6px auto 18px;text-align:center;color:#fff;font-weight:700;direction:ltr;text-shadow:0 1px 4px #0005}
.sig a{color:#fff}
.lg{height:60px;border-radius:12px;background:#fff;padding:3px}.cv{text-align:center}.cv img{width:100%;max-width:380px;border-radius:18px}.cv h2{margin:10px 0 2px;color:var(--pr)}.cv p{margin:0 0 14px;color:var(--mu)}
